services:
  postgres:
    image: postgres:16-alpine
    container_name: ashram-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: ashram_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: ashram-web
    ports:
      - "3002:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/ashram_db?schema=public"
    depends_on:
      - postgres

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"    

volumes:
  postgres_data:
  minio_data: